<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sal POS - Login</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--background) 0%, hsl(160, 30%, 95%) 100%);
      padding: 1rem;
    }
    
    .login-wrapper {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    
    .login-header {
      text-align: center;
    }
    
    .login-logo {
      width: 4rem;
      height: 4rem;
      background: var(--primary);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      box-shadow: 0 4px 14px var(--primary-shadow);
    }
    
    .login-logo svg {
      width: 2rem;
      height: 2rem;
      color: white;
    }
    
    .login-title {
      font-size: 1.875rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--foreground);
    }
    
    .login-subtitle {
      color: var(--muted-foreground);
      font-size: 0.875rem;
    }
    
    .login-card {
      background: var(--card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }
    
    .login-card-header {
      padding: 1.5rem 1.5rem 0;
    }
    
    .login-card-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    
    .login-card-description {
      color: var(--muted-foreground);
      font-size: 0.875rem;
    }
    
    .login-card-content {
      padding: 1.5rem;
    }
    
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }
    
    .input-icon-wrapper {
      position: relative;
    }
    
    .input-icon {
      position: absolute;
      left: 0.875rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted-foreground);
      width: 1rem;
      height: 1rem;
    }
    
    .input-with-icon {
      padding-left: 2.5rem;
    }
    
    #pinDisplay {
      font-size: 1.5rem;
      text-align: center;
      letter-spacing: 0.5rem;
      padding: 0.875rem;
    }
    
    .error-message {
      color: var(--destructive);
      font-size: 0.875rem;
      text-align: center;
      min-height: 1.25rem;
    }
    
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin: 1rem 0;
    }
    
    .key {
      padding: 1.25rem;
      font-size: 1.25rem;
      font-weight: 600;
      background: var(--secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    
    .key:hover {
      background: var(--muted);
      transform: scale(1.02);
    }
    
    .key:active {
      transform: scale(0.98);
    }
    
    .key.clear {
      background: var(--destructive-light);
      color: var(--destructive);
      border-color: transparent;
    }
    
    .key.clear:hover {
      background: var(--destructive);
      color: white;
    }
    
    .enter-btn {
      width: 100%;
      padding: 1rem;
      font-size: 1rem;
      font-weight: 600;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px var(--primary-shadow);
    }
    
    .enter-btn:hover {
      background: hsl(160, 84%, 35%);
      transform: translateY(-1px);
    }
    
    .enter-btn:active {
      transform: translateY(0);
    }
    
    .login-card-footer {
      padding: 1rem 1.5rem 1.5rem;
      text-align: center;
    }
    
    .footer-divider {
      position: relative;
      margin-bottom: 1rem;
    }
    
    .footer-divider::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: var(--border);
    }
    
    .footer-divider span {
      position: relative;
      background: var(--card);
      padding: 0 0.75rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--muted-foreground);
      letter-spacing: 0.05em;
    }
    
    .status-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: var(--muted-foreground);
    }
    
    .status-dot {
      width: 0.5rem;
      height: 0.5rem;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-wrapper">
      <div class="login-header">
        <div class="login-logo">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9Z"/>
            <path d="m3 9 2.45-4.9A2 2 0 0 1 7.24 3h9.52a2 2 0 0 1 1.8 1.1L21 9"/>
            <path d="M12 3v6"/>
          </svg>
        </div>
        <h1 class="login-title">My Store</h1>
        <p class="login-subtitle">Enter your PIN to access the terminal</p>
      </div>
      
      <div class="login-card">
        <div class="login-card-header">
          <h2 class="login-card-title">Sign In</h2>
          <p class="login-card-description">Welcome back. Enter your 4-digit PIN.</p>
        </div>
        
        <div class="login-card-content">
          <form class="login-form" onsubmit="return false;">
            <div class="form-group">
              <label class="label" for="pinDisplay">PIN Code</label>
              <input id="pinDisplay" type="password" class="input" placeholder="****" readonly maxlength="4">
            </div>
            
            <div id="errorMsg" class="error-message"></div>
            
            <div class="keypad">
              <button type="button" class="key">1</button>
              <button type="button" class="key">2</button>
              <button type="button" class="key">3</button>
              <button type="button" class="key">4</button>
              <button type="button" class="key">5</button>
              <button type="button" class="key">6</button>
              <button type="button" class="key">7</button>
              <button type="button" class="key">8</button>
              <button type="button" class="key">9</button>
              <button type="button" class="key clear">C</button>
              <button type="button" class="key">0</button>
              <button type="button" class="key" style="visibility: hidden;"></button>
            </div>
            
            <button type="button" class="enter-btn" id="enterBtn">Access Terminal</button>
          </form>
        </div>
        
        <div class="login-card-footer">
          <div class="footer-divider">
            <span>System Status</span>
          </div>
          <div class="status-indicator">
            <span class="status-dot"></span>
            <span>Online</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const pinDisplay = document.getElementById("pinDisplay");
    const errorMsg = document.getElementById("errorMsg");
    let users = [];
    let selectedUser = null;

    async function loadUsers() {
      try {
        const res = await fetch('/api/users');
        const data = await res.json();
        if (data.success && data.users) {
          users = data.users.filter(u => u.active !== 0);
          if (users.length > 0) {
            selectedUser = users[0];
            updateUserDisplay();
          }
        }
      } catch (err) {
        console.error('Failed to load users:', err);
        users = [{ username: 'owner', display_name: 'Owner', role: 'owner' }];
        selectedUser = users[0];
      }
    }

    function updateUserDisplay() {
      const subtitle = document.querySelector('.login-card-description');
      if (subtitle && selectedUser) {
        subtitle.textContent = `Logging in as: ${selectedUser.display_name || selectedUser.username}`;
      }
    }

    document.querySelectorAll(".key").forEach(btn => {
      btn.addEventListener("click", () => {
        if (btn.classList.contains("clear")) {
          pinDisplay.value = "";
          errorMsg.textContent = "";
        } else if (btn.textContent.trim()) {
          if (pinDisplay.value.length < 6) {
            pinDisplay.value += btn.textContent;
          }
        }
      });
    });

    document.getElementById("enterBtn").addEventListener("click", async () => {
      const pin = pinDisplay.value;
      if (pin.length < 4) {
        errorMsg.textContent = "PIN must be at least 4 digits";
        return;
      }

      if (!selectedUser) {
        errorMsg.textContent = "No user selected";
        return;
      }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: selectedUser.username, pin })
        });

        const data = await res.json();

        if (data.success && data.user) {
          sessionStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = 'index.html';
        } else {
          errorMsg.textContent = data.error || "Incorrect PIN. Please try again.";
          pinDisplay.value = "";
        }
      } catch (err) {
        errorMsg.textContent = "Login failed. Please try again.";
        pinDisplay.value = "";
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key >= "0" && e.key <= "9" && pinDisplay.value.length < 6) {
        pinDisplay.value += e.key;
      } else if (e.key === "Backspace") {
        pinDisplay.value = pinDisplay.value.slice(0, -1);
      } else if (e.key === "Enter") {
        document.getElementById("enterBtn").click();
      }
    });

    loadUsers();

    const savedTheme = localStorage.getItem('sal-pos-theme') || 'light';
    document.body.className = savedTheme;

    // Listen for theme changes via IPC (Electron)
    if (window.electronAPI && window.electronAPI.onThemeChanged) {
      window.electronAPI.onThemeChanged((theme) => {
        document.body.className = theme;
        localStorage.setItem('sal-pos-theme', theme);
        console.log('Theme changed via IPC to:', theme);
      });
    }
  </script>
</body>
</html>
